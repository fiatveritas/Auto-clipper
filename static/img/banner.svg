<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e10"/>
      <stop offset="50%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#0e0e10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9147ff"/>
      <stop offset="100%" style="stop-color:#bf94ff"/>
    </linearGradient>
    <linearGradient id="tiktokGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0050"/>
      <stop offset="100%" style="stop-color:#00f2ea"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#9147ff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Accent glow orbs -->
  <circle cx="150" cy="315" r="200" fill="#9147ff" opacity="0.04"/>
  <circle cx="1050" cy="315" r="200" fill="#bf94ff" opacity="0.04"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Left side: Logo area -->
  <g transform="translate(180, 200)">
    <!-- Play button with scissors -->
    <polygon points="-45,-55 55,0 -45,55" fill="url(#accentGrad)" filter="url(#softGlow)"/>
    <g transform="translate(35, 48)">
      <line x1="-22" y1="0" x2="28" y2="-35" stroke="#ff0050" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-22" y1="0" x2="28" y2="35" stroke="#00f2ea" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="33" cy="-40" r="9" fill="none" stroke="#ff0050" stroke-width="3"/>
      <circle cx="33" cy="40" r="9" fill="none" stroke="#00f2ea" stroke-width="3"/>
      <circle cx="-22" cy="0" r="3" fill="#efeff1"/>
    </g>
  </g>

  <!-- Main title -->
  <text x="340" y="220" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#accentGrad)">Auto-Clipper</text>

  <!-- Subtitle -->
  <text x="340" y="270" font-family="Arial, sans-serif" font-size="24" fill="#adadb8">AI-Powered Highlight Detection for Streamers</text>

  <!-- Feature pills -->
  <g transform="translate(340, 310)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="rgba(145,71,255,0.15)" stroke="#9147ff" stroke-width="1.5"/>
    <text x="70" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#bf94ff">17 Games</text>

    <rect x="155" y="0" width="140" height="36" rx="18" fill="rgba(255,0,80,0.1)" stroke="#ff0050" stroke-width="1.5"/>
    <text x="225" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ff0050">TikTok Export</text>

    <rect x="310" y="0" width="160" height="36" rx="18" fill="rgba(0,242,234,0.1)" stroke="#00f2ea" stroke-width="1.5"/>
    <text x="390" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00f2ea">YouTube Shorts</text>

    <rect x="485" y="0" width="120" height="36" rx="18" fill="rgba(0,200,83,0.1)" stroke="#00c853" stroke-width="1.5"/>
    <text x="545" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00c853">GIF Export</text>
  </g>

  <!-- Second row of pills -->
  <g transform="translate(340, 360)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="rgba(145,71,255,0.1)" stroke="#9147ff" stroke-width="1"/>
    <text x="65" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#adadb8">Clip Editor</text>

    <rect x="145" y="0" width="120" height="36" rx="18" fill="rgba(145,71,255,0.1)" stroke="#9147ff" stroke-width="1"/>
    <text x="205" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#adadb8">Watermark</text>

    <rect x="280" y="0" width="110" height="36" rx="18" fill="rgba(145,71,255,0.1)" stroke="#9147ff" stroke-width="1"/>
    <text x="335" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#adadb8">Captions</text>

    <rect x="405" y="0" width="130" height="36" rx="18" fill="rgba(145,71,255,0.1)" stroke="#9147ff" stroke-width="1"/>
    <text x="470" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#adadb8">Zoom/Pan FX</text>

    <rect x="550" y="0" width="130" height="36" rx="18" fill="rgba(145,71,255,0.1)" stroke="#9147ff" stroke-width="1"/>
    <text x="615" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#adadb8">Sound FX</text>
  </g>

  <!-- Tagline -->
  <text x="340" y="450" font-family="Arial, sans-serif" font-size="20" fill="#efeff1">Paste a Twitch VOD. Get TikTok-ready clips in minutes.</text>

  <!-- Bottom bar with game icons -->
  <rect x="0" y="500" width="1200" height="130" fill="rgba(0,0,0,0.3)"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#adadb8" letter-spacing="2">SUPPORTED GAMES</text>

  <g transform="translate(85, 565)" font-family="Arial, sans-serif" font-size="12" fill="#adadb8" text-anchor="middle">
    <text x="0">Fortnite</text>
    <text x="100">Apex</text>
    <text x="200">Valorant</text>
    <text x="300">CoD</text>
    <text x="400">CS2</text>
    <text x="500">LoL</text>
    <text x="600">Minecraft</text>
    <text x="700">GTA V</text>
    <text x="800">OW2</text>
    <text x="900">Elden Ring</text>
    <text x="1000">+7 more</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#tiktokGrad)"/>
</svg>