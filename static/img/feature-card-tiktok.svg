<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e10"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="tt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0050"/>
      <stop offset="100%" style="stop-color:#00f2ea"/>
    </linearGradient>
    <linearGradient id="yt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg2)"/>
  <rect x="0" y="0" width="600" height="3" rx="1.5" fill="url(#tt)"/>

  <!-- Phone mockups -->
  <!-- TikTok phone -->
  <g transform="translate(130, 40)">
    <rect x="0" y="0" width="120" height="213" rx="12" fill="#000" stroke="#2f2f35" stroke-width="2"/>
    <!-- Gameplay region -->
    <rect x="4" y="4" width="112" height="145" rx="8" fill="#1a1a2e"/>
    <text x="60" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff00" opacity="0.6">GAMEPLAY</text>
    <!-- Webcam region -->
    <rect x="4" y="153" width="112" height="56" rx="8" fill="#0a0a1e"/>
    <text x="60" y="185" text-anchor="middle" font-family="Arial" font-size="9" fill="#00aaff" opacity="0.6">WEBCAM</text>
    <!-- TikTok label -->
    <text x="60" y="235" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="url(#tt)">TikTok</text>
  </g>

  <!-- YouTube phone -->
  <g transform="translate(350, 40)">
    <rect x="0" y="0" width="120" height="213" rx="12" fill="#000" stroke="#2f2f35" stroke-width="2"/>
    <!-- Safe zone -->
    <rect x="4" y="4" width="112" height="20" rx="4" fill="rgba(255,0,0,0.1)"/>
    <text x="60" y="17" text-anchor="middle" font-family="Arial" font-size="7" fill="#ff0000" opacity="0.5">SAFE ZONE</text>
    <!-- Gameplay -->
    <rect x="4" y="28" width="112" height="131" rx="6" fill="#1a1a2e"/>
    <text x="60" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff00" opacity="0.6">GAMEPLAY</text>
    <!-- Webcam -->
    <rect x="4" y="163" width="112" height="46" rx="6" fill="#0a0a1e"/>
    <text x="60" y="190" text-anchor="middle" font-family="Arial" font-size="9" fill="#00aaff" opacity="0.6">WEBCAM</text>
    <!-- YT label -->
    <text x="60" y="235" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="url(#yt)">YouTube Shorts</text>
  </g>

  <!-- Presets indicator -->
  <g transform="translate(130, 280)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="rgba(145,71,255,0.15)" stroke="#9147ff" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#9147ff">Top-Right</text>
    <rect x="100" y="0" width="100" height="24" rx="12" fill="rgba(145,71,255,0.15)" stroke="#9147ff" stroke-width="1"/>
    <text x="150" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#9147ff">Bottom-Right</text>
    <rect x="210" y="0" width="80" height="24" rx="12" fill="rgba(145,71,255,0.15)" stroke="#9147ff" stroke-width="1"/>
    <text x="250" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#9147ff">No Cam</text>
    <rect x="300" y="0" width="80" height="24" rx="12" fill="rgba(145,71,255,0.15)" stroke="#9147ff" stroke-width="1"/>
    <text x="340" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#9147ff">Custom</text>
  </g>

  <text x="300" y="340" text-anchor="middle" font-family="Arial Black, Arial" font-size="26" font-weight="900" fill="url(#tt)">Vertical Video Export</text>
  <text x="300" y="370" text-anchor="middle" font-family="Arial" font-size="16" fill="#adadb8">TikTok + YouTube Shorts + Batch Export</text>
</svg>