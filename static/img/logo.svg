<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9147ff"/>
      <stop offset="100%" style="stop-color:#bf94ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0e0e10" stroke="url(#grad)" stroke-width="6"/>
  <!-- Film strip / scissors icon -->
  <g transform="translate(256,240)" filter="url(#glow)">
    <!-- Play triangle -->
    <polygon points="-60,-80 80,0 -60,80" fill="url(#grad)" opacity="0.9"/>
    <!-- Scissors blades -->
    <g transform="translate(50, 70)">
      <line x1="-30" y1="0" x2="40" y2="-50" stroke="#ff0050" stroke-width="6" stroke-linecap="round"/>
      <line x1="-30" y1="0" x2="40" y2="50" stroke="#00f2ea" stroke-width="6" stroke-linecap="round"/>
      <circle cx="46" cy="-56" r="12" fill="none" stroke="#ff0050" stroke-width="4"/>
      <circle cx="46" cy="56" r="12" fill="none" stroke="#00f2ea" stroke-width="4"/>
      <circle cx="-30" cy="0" r="4" fill="#efeff1"/>
    </g>
  </g>
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="url(#grad)">AUTO-CLIPPER</text>
  <text x="256" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adadb8">AI-Powered Highlight Detection</text>
</svg>